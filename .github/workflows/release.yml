name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.1.0"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="${{ inputs.tag }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}"

      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ steps.version.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@v5.2.0
        with:
          go-version: "1.23.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X github.com/igun997/freelancer-mcp/internal/cliapp.Version=${VERSION} -X main.version=${VERSION}"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            suffix=""
            if [ "$goos" = "windows" ]; then suffix=".exe"; fi

            name="freelancer-mcp_${VERSION}_${goos}_${goarch}"
            stage="dist/${name}"
            mkdir -p "$stage"
            for cmd in freelancer freelancer-mcp; do
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -ldflags "$ldflags" -o "$stage/${cmd}${suffix}" "./cmd/${cmd}"
            done
            cp README.md "$stage/"
            cp -r docs "$stage/docs"
            if [ -f LICENSE ]; then cp LICENSE "$stage/"; fi

            if [ "$goos" = "windows" ]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              tar -czf "${stage}.tar.gz" -C dist "${name}"
            fi
            rm -rf "$stage"
          done

          (cd dist && sha256sum ./* > checksums.txt)
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/freelancer-mcp_${VERSION}_linux_amd64.tar.gz | tar -xz"
            echo "cd freelancer-mcp_${VERSION}_linux_amd64"
            echo "./freelancer login --user you@example.com"
            echo '```'
            echo
            echo "Binaries: \`freelancer\` (CLI) and \`freelancer-mcp\` (MCP stdio server)."
            echo "Verify downloads against \`checksums.txt\`."
          } > "$notes_file"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --title "$VERSION" \
              --notes-file "$notes_file" \
              --generate-notes
          fi
